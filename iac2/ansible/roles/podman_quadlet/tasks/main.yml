---
- name: Ensure Quadlet systemd directory exists
  ansible.builtin.file:
    path: /etc/containers/systemd
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Deploy Quadlet container unit files
  ansible.builtin.template:
    src: "{{ item }}.container.j2"
    dest: "/etc/containers/systemd/{{ item }}.container"
    owner: root
    group: root
    mode: '0644'
  loop: "{{ quadlet_services | default([]) }}"
  notify: reload and restart quadlets